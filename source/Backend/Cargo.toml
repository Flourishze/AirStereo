[workspace]
resolver = "2"
members = [
    "crates/airplay-core",
    "crates/airplay-crypto",
    "crates/airplay-discovery",
    "crates/airplay-pairing",
    "crates/airplay-rtsp",
    "crates/airplay-timing",
    "crates/airplay-resampler",
    "crates/airplay-audio",
    "crates/airplay-client",
    "crates/airstereo2-backend",
]

[workspace.package]
version = "1.1.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1.45", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
plist = "1.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
base64 = "0.22"
bytes = "1.10"
rand = "0.8"
rand_chacha = "0.3"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
aes = "0.8"
ctr = "0.9"
cbc = "0.1"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
num-bigint = "0.4"
md5 = "0.7"
mdns-sd = "0.13"
if-addrs = "0.13"
crossbeam-channel = "0.5"
biquad = "0.4"
alac-encoder = "0.3"
rubato = "0.15"
wasapi = "0.17"
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
